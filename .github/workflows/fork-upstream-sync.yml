name: Fork-only upstream synchronization

# Runs ONLY on SoHiVerse's default dev branch. PR #1 has already been
# merged into this branch, so it alone is the maintained customized fork.
# The historical feature branch is kept separate for possible upstream review.
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-only-upstream-dev-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'SoHiVerse/pptb-mxrm-commandbar-studio' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fork without persisting write credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare a non-destructive fork dev merge
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/mohsinonxrm/pptb-mxrm-commandbar-studio.git
          git fetch --no-tags upstream +refs/heads/dev:refs/remotes/upstream/dev
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev

          upstream_sha="$(git rev-parse refs/remotes/upstream/dev)"
          fork_sha="$(git rev-parse refs/remotes/origin/dev)"
          printf 'upstream_sha=%s\nfork_sha=%s\n' "$upstream_sha" "$fork_sha" >> "$GITHUB_OUTPUT"

          git checkout -B sync-fork-dev "$fork_sha"
          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Fork dev already contains the latest upstream dev commit.'
          else
            # A normal merge preserves PR #1 and future custom fork commits.
            # Git aborts on conflicts. Do not force, reset, or prefer either
            # side of a conflict without review.
            git merge --no-edit "$upstream_sha"
            if [[ -n "$(git diff --name-only "$fork_sha" HEAD -- .github/workflows)" ]]; then
              echo 'Upstream changed workflow files; review required. No refs pushed.' >&2
              exit 1
            fi
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Prepared safe upstream merge into fork dev: $(git rev-parse HEAD)"
          fi

      - name: Set up Node for candidate verification
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Test the combined customized fork before updating dev
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git checkout sync-fork-dev
          # The fork dev branch has its own pinned dependency lockfile.
          # If upstream changes dependencies incompatibly, npm ci must fail
          # closed until the fork lock is reviewed.
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm test -- --maxWorkers=2
          npm run test:package:onprem
          npm run build
          npm run build:onprem
          if [[ -n "$(git status --porcelain --untracked-files=normal)" ]]; then
            echo 'Verification changed the checkout; refusing to push.' >&2
            git status --short
            exit 1
          fi

      - name: Recheck remote tips and fast-forward fork dev
        if: steps.merge.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.merge.outputs.changed }}
          EXPECTED_FORK: ${{ steps.merge.outputs.fork_sha }}
          EXPECTED_UPSTREAM: ${{ steps.merge.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          # Avoid pushing a candidate based on stale upstream or fork refs.
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          git fetch --no-tags upstream +refs/heads/dev:refs/remotes/upstream/dev
          [[ "$(git rev-parse refs/remotes/origin/dev)" == "$EXPECTED_FORK" ]] ||
            { echo 'Fork dev advanced; rerun required. No push.' >&2; exit 1; }
          [[ "$(git rev-parse refs/remotes/upstream/dev)" == "$EXPECTED_UPSTREAM" ]] ||
            { echo 'Upstream dev advanced during verification. Rerun required.' >&2; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_FORK" sync-fork-dev ||
            { echo 'Candidate does not descend from fork dev. No push.' >&2; exit 1; }

          # The token is exposed only to the final Git command. No PAT or
          # privileged pull_request_target event is needed.
          cat > "$RUNNER_TEMP/fork-askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$RUNNER_TEMP/fork-askpass"
          if [[ "$CHANGED" == 'true' ]]; then
            GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$RUNNER_TEMP/fork-askpass" \
              git push origin sync-fork-dev:refs/heads/dev
          else
            # A manual no-op run tests push rights without moving any ref.
            GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$RUNNER_TEMP/fork-askpass" \
              git push --dry-run origin sync-fork-dev:refs/heads/dev
          fi
          rm -f "$RUNNER_TEMP/fork-askpass"
